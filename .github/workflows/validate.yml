name: ESPHome validation
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade esphome
      - name: Prepare CI secrets
        run: printf 'wifi_ssid: "CI-DUMMY-WIFI"\nwifi_password: "CI-DUMMY-PASSWORD"\n' > examples/secrets.yaml
      - run: esphome config examples/esp32-relay-x2.yaml
      - run: esphome compile examples/esp32-relay-x2.yaml
