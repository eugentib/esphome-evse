name: ESPHome validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ESPHome
        run: python -m pip install --upgrade esphome
      - name: Validate
        run: esphome config examples/esp32-relay-x2.yaml
      - name: Compile
        run: esphome compile examples/esp32-relay-x2.yaml
