substitutions:
  name: esp32-relay-x2-evse
  friendly_name: ESP32 Relay X2 EVSE

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# Bluetooth proxy is deliberately advertisement-only at first.
# The EVSE control path runs in its own pinned FreeRTOS task, independent of
# ESPHome's main loop and BLE callbacks.
esp32_ble_tracker:
  software_coexistence: true
  scan_parameters:
    active: false

bluetooth_proxy:
  active: false

external_components:
  - source: github://eugentib/esphome-evse@main
    components: [evse]
    refresh: 1min

switch:
  - platform: template
    name: "EVSE Enable"
    id: evse_enable
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(evse_controller).is_enabled();
    turn_on_action:
      - lambda: id(evse_controller).set_enabled(true);
    turn_off_action:
      - lambda: id(evse_controller).set_enabled(false);

  - platform: template
    name: "EVSE Available"
    id: evse_available
    restore_mode: ALWAYS_ON
    lambda: |-
      return id(evse_controller).is_available();
    turn_on_action:
      - lambda: id(evse_controller).set_available(true);
    turn_off_action:
      - lambda: id(evse_controller).set_available(false);

button:
  - platform: template
    name: "EVSE Reset Fault"
    on_press:
      - lambda: id(evse_controller).reset_fault();

# GPIO25 is owned directly by the EVSE component through ESP-IDF LEDC.
# External bipolar driver mapping:
#   GPIO25 HIGH -> +12 V CP
#   GPIO25 LOW  -> -12 V CP
#   1 kHz PWM   -> +12/-12 V CP
# Static A/B1/C1 states use true DC HIGH, not a ~100% PWM waveform.

number:
  - platform: template
    name: "EVSE Current Limit"
    id: evse_current_limit
    min_value: 6
    max_value: 16
    step: 1
    unit_of_measurement: A
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 6
    set_action:
      - lambda: id(evse_controller).set_current_limit(x);

evse:
  id: evse_controller
  pilot_pwm_pin: GPIO25
  pilot_adc_pin: GPIO34

  # v0.4.3 controls the onboard relay directly from the dedicated EVSE task.
  # On ESP32 Relay X2, relay 1 is GPIO16. It must drive only an EXTERNAL
  # contactor coil, never the EV charging current itself.
  contactor_pin: GPIO16

  max_current: 16
  default_current: 6
  allow_ventilation: false

  # The dedicated FreeRTOS task samples and executes the state machine every
  # 20 ms. GPIO34 is ADC1, so BLE/Wi-Fi do not create the ADC2 conflict.
  sample_interval: 20ms
  # Continuous ADC/DMA: 80 samples per 1 kHz CP period. At 6 A / 10% duty
  # there are about 8 samples in every positive 100 us pulse.
  adc_sample_rate: 80000
  adc_peak_samples: 16
  adc_min_samples: 200
  adc_fault_time: 100ms
  cp_confirm_windows: 3
  stable_time: 250ms
  contactor_close_delay: 1ms
  graceful_stop_timeout: 6s
  diode_fault_time: 100ms
  fault_retry_time: 60s

  # Dedicated EVSE task. Core 1 keeps it separate from the ESP32 BLE tracker,
  # which runs on core 0 on dual-core ESP32 devices.
  task_core: 1
  task_priority: 5
  task_stack_size: 4096

  # Development-only task timing instrumentation.
  # For the final installation, change only this line to false; the
  # sensor definitions below may remain in the YAML and will not be
  # instantiated/published.
  timing_debug: true

  # Calibrated windows for the assembled CP feedback network:
  #   R9  = 500 kΩ from CP
  #   R10 = 100 kΩ to 3.3 V
  #   R11 = 100 kΩ to GND
  #
  # Approximate transfer at 3.3 V:
  #   Vadc[V] ~= 1.500 + Vcp/11
  #
  # IEC/J1772 nominal windows represented here:
  #   A: +11...+13 V, B: +8...+10 V,
  #   C: +5...+7 V,  D: +2...+4 V.
  state_a_min_mv: 2480
  state_a_max_mv: 2700
  state_b_min_mv: 2210
  state_b_max_mv: 2430
  state_c_min_mv: 1935
  state_c_max_mv: 2160
  state_d_min_mv: 1660
  state_d_max_mv: 1885

  # Valid negative half-cycle, calibrated for the actual -12 V rail.
  diode_min_mv: 300
  diode_max_mv: 520

  state:
    name: "EVSE State"
  physical_state:
    name: "EVSE CP Physical State"
  fault_reason:
    name: "EVSE Fault Reason"
  cp_high_mv:
    name: "EVSE CP High"
  cp_low_mv:
    name: "EVSE CP Low"
  advertised_current:
    name: "EVSE Advertised Current"
  # These entities are created only while timing_debug: true.
  task_late_cycles:
    name: "EVSE Task Late Cycles"
  task_last_runtime:
    name: "EVSE Task Last Runtime"
  task_max_runtime:
    name: "EVSE Task Max Runtime"
  task_last_lateness:
    name: "EVSE Task Last Lateness"
  task_max_lateness:
    name: "EVSE Task Max Lateness"
  task_missed_deadlines:
    name: "EVSE Task Missed Deadlines"
  adc_sample_count:
    name: "EVSE ADC Samples Last Cycle"
  adc_read_errors:
    name: "EVSE ADC Read Errors"
  pilot_duty:
    name: "EVSE Pilot Duty"
  pilot_mode:
    name: "EVSE Pilot Mode"
  vehicle_connected:
    name: "EVSE Vehicle Connected"
  charging:
    name: "EVSE Charging"
  stopping:
    name: "EVSE Graceful Stop"
  fault:
    name: "EVSE Fault"
  task_running:
    name: "EVSE Task Running"
