substitutions:
  name: esp32-relay-x2-evse
  friendly_name: ESP32 Relay X2 EVSE

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
api:
ota:
  - platform: esphome

wifi:
  ssid: "CI-DUMMY-WIFI"
  password: "CI-DUMMY-PASSWORD"

external_components:
  - source:
      type: local
      path: ../components
    components: [evse]

switch:
  # ESP32 Relay X2 onboard relay 1. It must only drive an EXTERNAL contactor coil.
  - platform: gpio
    id: evse_contactor_hw
    pin: GPIO16
    restore_mode: ALWAYS_OFF
    internal: true

  - platform: template
    name: "EVSE Enable"
    id: evse_enable
    restore_mode: ALWAYS_OFF
    lambda: |-
      return id(evse_controller).is_enabled();
    turn_on_action:
      - lambda: id(evse_controller).set_enabled(true);
    turn_off_action:
      - lambda: id(evse_controller).set_enabled(false);

  - platform: template
    name: "EVSE Available"
    id: evse_available
    restore_mode: ALWAYS_ON
    lambda: |-
      return id(evse_controller).is_available();
    turn_on_action:
      - lambda: id(evse_controller).set_available(true);
    turn_off_action:
      - lambda: id(evse_controller).set_available(false);

button:
  - platform: template
    name: "EVSE Reset Fault"
    on_press:
      - lambda: id(evse_controller).reset_fault();

# GPIO25 supplies the 1 kHz LOGIC signal to the external bipolar CP driver.
# External driver mapping required by this component:
#   logic 1 / 100% duty -> +12 V CP
#   logic 0 /   0% duty -> -12 V CP
#   PWM                  -> +12/-12 V CP
output:
  - platform: ledc
    id: cp_pwm
    pin: GPIO25
    frequency: 1000Hz

number:
  - platform: template
    name: "EVSE Current Limit"
    id: evse_current_limit
    min_value: 6
    max_value: 16
    step: 1
    unit_of_measurement: A
    mode: slider
    optimistic: true
    restore_value: true
    initial_value: 6
    set_action:
      - lambda: id(evse_controller).set_current_limit(x);

evse:
  id: evse_controller
  pilot_output: cp_pwm
  pilot_adc_pin: GPIO34
  contactor: evse_contactor_hw

  max_current: 16
  default_current: 6
  allow_ventilation: false

  sample_interval: 20ms
  sample_window_us: 1600
  stable_time: 250ms
  contactor_close_delay: 1ms
  graceful_stop_timeout: 6s
  diode_fault_time: 100ms
  fault_retry_time: 60s

  # EXAMPLE/PLACEHOLDER WINDOWS ONLY.
  # These roughly correspond to the proposed bipolar feedback mapping
  # (~0.3 V at -12 V CP, ~1.65 V at 0 V, ~3.0 V at +12 V).
  # You MUST calibrate them on your actual analog front-end before connecting a car.
  state_a_min_raw: 3550
  state_a_max_raw: 3950
  state_b_min_raw: 3150
  state_b_max_raw: 3475
  state_c_min_raw: 2725
  state_c_max_raw: 3075
  state_d_min_raw: 2300
  state_d_max_raw: 2650

  # Valid negative half-cycle around -12 V after scaling.
  diode_min_raw: 200
  diode_max_raw: 600

  state:
    name: "EVSE State"
  physical_state:
    name: "EVSE CP Physical State"
  fault_reason:
    name: "EVSE Fault Reason"
  cp_high_raw:
    name: "EVSE CP High Raw"
  cp_low_raw:
    name: "EVSE CP Low Raw"
  advertised_current:
    name: "EVSE Advertised Current"
  vehicle_connected:
    name: "EVSE Vehicle Connected"
  charging:
    name: "EVSE Charging"
  stopping:
    name: "EVSE Graceful Stop"
  fault:
    name: "EVSE Fault"
